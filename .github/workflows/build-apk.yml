                  m_txt = mf.read()
              m_txt = m_txt.replace("@android:drawable/sym_def_app_icon", "@drawable/ic_nasiva_logo")
              with open("app/src/main/AndroidManifest.xml", "w") as mf:
                  mf.write(m_txt)
              print("Logo Nasiva berhasil dipasang sebagai ikon APK!")
          except Exception as e:
              print("Menggunakan ikon default:", e)

          print("Seluruh file proyek Android berhasil dibuat otomatis!")
          PYEOF

      - name: Siapkan Android SDK & Gradle 8.5 (Bebas Error Cache GitHub)
        run: |
          set -e
          # 1. Pastikan Android SDK siap digunakan di Ubuntu 24 / Ubuntu 26
          if [ -z "$ANDROID_HOME" ]; then
            if [ -d "/usr/local/lib/android/sdk" ]; then
              export ANDROID_HOME="/usr/local/lib/android/sdk"
            else
              mkdir -p /tmp/android-sdk/cmdline-tools
              curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
              unzip -q /tmp/cmdtools.zip -d /tmp/android-sdk/cmdline-tools
              mv /tmp/android-sdk/cmdline-tools/cmdline-tools /tmp/android-sdk/cmdline-tools/latest
              export ANDROID_HOME="/tmp/android-sdk"
            fi
          fi
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          # Terima lisensi & pastikan platform 34 tersedia
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -f "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            if [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
              "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" > /dev/null
            fi
          fi

          # 2. Download Gradle 8.5 langsung (Tanpa melalui Cache GitHub yang sedang gangguan)
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/gradle.zip
          unzip -q -o /tmp/gradle.zip -d /tmp

          # 3. Jalankan Build APK
          /tmp/gradle-8.5/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Upload File APK Siap Install
        uses: actions/upload-artifact@v4
        with:
          name: NasivaStorage-Realtime-v22-APK
          path: app/build/outputs/apk/debug/*.apk
