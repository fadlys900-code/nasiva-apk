      - name: Rakit & Sign File APK Langsung (Tanpa Gradle & Bebas Error Cache)
        run: |
          set -e

          # 1. Deteksi lokasi Android SDK bawaan GitHub Runner
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            if [ -d "/usr/local/lib/android/sdk" ]; then
              export ANDROID_HOME="/usr/local/lib/android/sdk"
            elif [ -n "$ANDROID_SDK_ROOT" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
              export ANDROID_HOME="$ANDROID_SDK_ROOT"
            fi
          fi

          ANDROID_JAR=""
          AAPT2=""
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME" ]; then
            ANDROID_JAR=$(find "$ANDROID_HOME/platforms" -name "android.jar" 2>/dev/null | sort -V | tail -n 1 || true)
            AAPT2=$(find "$ANDROID_HOME/build-tools" -name "aapt2" 2>/dev/null | sort -V | tail -n 1 || true)
          fi

          # Fallback jika runner belum memiliki android.jar / aapt2
          if [ -z "$ANDROID_JAR" ] || [ -z "$AAPT2" ]; then
            echo "Mengunduh Android SDK Command-Line Tools..."
            mkdir -p /tmp/android-sdk/cmdline-tools
            curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
            unzip -q -o /tmp/cmdtools.zip -d /tmp/android-sdk/cmdline-tools
            mv /tmp/android-sdk/cmdline-tools/cmdline-tools /tmp/android-sdk/cmdline-tools/latest
            export ANDROID_HOME="/tmp/android-sdk"
            yes | /tmp/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
            /tmp/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0" > /dev/null
            ANDROID_JAR="$ANDROID_HOME/platforms/android-34/android.jar"
            AAPT2="$ANDROID_HOME/build-tools/34.0.0/aapt2"
          fi

          BUILD_TOOLS_DIR=$(dirname "$AAPT2")
          D8="$BUILD_TOOLS_DIR/d8"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          echo "ANDROID_JAR : $ANDROID_JAR"
          echo "BUILD_TOOLS : $BUILD_TOOLS_DIR"

          # 2. Siapkan folder kerja bersih
          rm -rf build_apk
          mkdir -p build_apk/gen build_apk/obj build_apk/dex app/build/outputs/apk/debug

          # 3. Kompilasi resource & AndroidManifest.xml menggunakan AAPT2
          "$AAPT2" compile --dir app/src/main/res -o build_apk/res.zip
          "$AAPT2" link -o build_apk/unsigned.apk \
            -I "$ANDROID_JAR" \
            --manifest app/src/main/AndroidManifest.xml \
            --java build_apk/gen \
            --auto-add-overlay \
            build_apk/res.zip

          # 4. Kompilasi seluruh file Java menjadi .class & bungkus ke classes.jar
          find build_apk/gen app/src/main/java -name "*.java" > build_apk/sources.txt
          javac -source 1.8 -target 1.8 -encoding UTF-8 \
            -bootclasspath "$ANDROID_JAR" \
            -classpath "$ANDROID_JAR" \
            -d build_apk/obj \
            @build_apk/sources.txt
          jar cf build_apk/classes.jar -C build_apk/obj .

          # 5. Konversi classes.jar menjadi classes.dex menggunakan D8
          "$D8" --lib "$ANDROID_JAR" --min-api 23 --output build_apk/dex build_apk/classes.jar

          # 6. Gabungkan classes.dex ke dalam APK & ratakan dengan zipalign
          cp build_apk/unsigned.apk build_apk/unaligned.apk
          (cd build_apk/dex && zip -q -u ../unaligned.apk classes.dex)
          "$ZIPALIGN" -f -p 4 build_apk/unaligned.apk build_apk/aligned.apk

          # 7. Buat Keystore & Sign APK (V1 + V2 + V3 Signature)
          keytool -genkeypair -v \
            -keystore build_apk/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Nasiva Storage,OU=Gaming,O=Nasiva,L=Bekasi,ST=Jabar,C=ID"

          "$APKSIGNER" sign \
            --ks build_apk/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app/build/outputs/apk/debug/NasivaStorage-Realtime-v23.apk \
            build_apk/aligned.apk

          echo "=== APK BERHASIL DIBUAT ==="
          ls -lh app/build/outputs/apk/debug/NasivaStorage-Realtime-v23.apk

      - name: Upload File APK Siap Install
        uses: actions/upload-artifact@v4
        with:
          name: NasivaStorage-Realtime-v23-APK
          path: app/build/outputs/apk/debug/*.apk
